spring:
  application:
    name: devtrack-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

server:
  port: ${PORT:8081}
  shutdown: graceful

devtrack:
  security:
    audience: ${KEYCLOAK_AUDIENCE:devtrack-backend}
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/devtrack}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/devtrack/protocol/openid-connect/certs}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
