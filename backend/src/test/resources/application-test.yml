spring:
  application:
    name: devtrack-backend-test
  datasource:
    url: jdbc:h2:mem:devtrack_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

devtrack:
  security:
    audience: devtrack-backend
    issuer: https://auth.devtrack.local/realms/devtrack
    jwk-set-uri: https://auth.devtrack.local/realms/devtrack/protocol/openid-connect/certs
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: INFO
    com.devtrack: DEBUG
